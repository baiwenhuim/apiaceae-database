{% extends 'basemodel.html' %}

{% block title %}
    Multi-omics Genome Browser Module - HEMU
{% endblock %}



{% block content %}
    {% load static %}
    <div class="container">
        <div class='row'><div class="col-md-12">
            <div style="text-align: center">
                <a class="btn btn-default" href="#">
                    <span class="glyphicon glyphicon-backward"></span>
                    Back to genome selector
                </a>
                <a class="btn btn-primary" href="https://shijunpenglab.com/jbrowse?config=jbrowse_resources%2F{{ species_full_name }}%2Fconfig.json">
                    <span class="glyphicon glyphicon-fullscreen"></span>
                    Go fullscreen
                </a>
                <br><br>
                <hr>
            </div>
        </div></div>
        <iframe src="https://shijunpenglab.com/jbrowse?config=jbrowse_resources%2F{{ species_full_name }}%2Fconfig.json"
                                        id="flex_iframe" width="100%" height="1000px"
                                        name="topFrame" frameborder="0"></iframe>
    </div>

{% endblock %}
